# ===================== Server =====================
server.port=8080
spring.application.name=nexus-hr-backend

# ===================== Datasource (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_hr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2202
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================== JWT =====================
# 256-bit secret used to sign tokens - replace with a securely generated value in production
jwt.secret=NexusHRSuperSecretKeyForJWTSigning1234567890
jwt.expiration.ms=86400000

# ===================== Jackson =====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================== File upload (profile images / resumes) =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
logging.level.com.example.demo=DEBUG

# ===================== CORS (adjust for your frontend origin) =====================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
